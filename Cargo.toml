[workspace]
members = ["crates/xenadmin-core", "crates/xenadmin-desktop", "tools/host-probe"]
resolver = "3"

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros", "fs"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
url = { version = "2", features = ["serde"] }
zeroize = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
rune = { git = "https://github.com/anomalyco/rune", rev = "f3d04f3f2069d177d04c963b0ba9f6b2065e46eb", default-features = false, features = ["accessibility", "dbus", "svg", "native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "f3d04f3f2069d177d04c963b0ba9f6b2065e46eb" }

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"

[patch.crates-io]
vnc-rs = { path = "vendor/vnc-rs" }
