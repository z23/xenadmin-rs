name: Rust and Rune checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build and render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxkbcommon-x11-0 libfontconfig1-dev libxcb1-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-xkb-dev libvulkan1 mesa-vulkan-drivers desktop-file-utils
      - name: Install the repository toolchain
        run: rustup show
      - name: Check, test, and render
        env:
          # Shared runners are slower than a workstation; extend fixture polling deadlines only.
          XENADMIN_TEST_TIME_SCALE: "4"
        run: ./scripts/check.sh
      - name: Keep rendered UI artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rune-ui
          path: |
            artifacts/*.png
            artifacts/*.json
          if-no-files-found: ignore
      - name: Reuse verified AppImage packaging inputs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/package-tools
          key: package-tools-${{ hashFiles('packaging/appimage-inputs.json') }}-${{ github.run_id }}
          restore-keys: |
            package-tools-${{ hashFiles('packaging/appimage-inputs.json') }}-
      - name: Build portable archive and AppImage
        run: ./scripts/package.sh --appimage
      - name: Keep verified packaging inputs for the next run
        # Inputs are hash-verified on every use, so saving a partial set after a failed
        # download leaves the next run fewer upstream fetches, never different bytes.
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/package-tools
          key: package-tools-${{ hashFiles('packaging/appimage-inputs.json') }}-${{ github.run_id }}
      - name: Keep versioned Linux packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64
          path: |
            artifacts/*.tar.gz
            artifacts/*.AppImage
            artifacts/*.sha256
          if-no-files-found: error
