[package]
name = "xenadmin-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GPUI Kit front end of the desktop client. The released binary stays xenadmin-rs until cutover."
publish = false

[dependencies]
gpui-kit.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
serde_json = { workspace = true, optional = true }
uuid.workspace = true
wayland-client = "0.31"
xenadmin-core = { path = "../xenadmin-core" }
xenadmin-ui = { path = "../xenadmin-ui" }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[features]
# The scene tool (PNG and element tree of any scene) and the renderer tests
# need the Kit test harness and its headless renderer. A build without this
# feature leaves both out.
scenes = ["gpui-kit/test-support", "dep:serde_json"]

# Not `workspace = true`: the workspace forbids unsafe, and the console's
# foreign-display wrapper is the one place that uses it. The allow is on
# `ForeignKeyboard::from_foreign_display`. xenadmin-core keeps `forbid`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
